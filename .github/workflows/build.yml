name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
      - run: cd build && ditto -c -k --keepParent SoftLock.app SoftLock.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SoftLock
          path: build/SoftLock.zip
